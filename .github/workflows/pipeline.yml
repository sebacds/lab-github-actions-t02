name: Pipeline DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lab-github-actions:${{ github.sha }}

      - name: security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lab-github-actions:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  quality:
    name: Escaneo de calidad
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: quality scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [security, quality]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: generar tag corto
        id: tag
        run: echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-github-actions:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-github-actions:${{ steps.tag.outputs.SHORT_SHA }}
      
      - name: generar reporte
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          mkdir -p reports
          echo "Commit: ${{ github.sha }}" > reports/build-report-$FECHA.txt
          echo "Branch: ${{ github.ref_name }}" >> reports/build-report-$FECHA.txt
          echo "Image-tag: ${{ steps.tag.outputs.SHORT_SHA }}" >> reports/build-report-$FECHA.txt

      - name: subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/build-report-*.txt
