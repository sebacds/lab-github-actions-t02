name: Reusable build

on:
  workflow_call:
  inputs:
    image-name:
      required: true
      type: string
  secrets:
    DOCKERHUB_USERNAME:
      required: true
    DOCKERHUB_TOKEN:
      required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: generar tag corto
        id: tag
        run: echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ steps.tag.outputs.SHORT_SHA }}
      
      - name: generar reporte
        run: |
          mkdir -p reports
          echo "Commit: ${{ github.sha }}" > reports/build-report.txt
          echo "Branch: ${{ github.ref_name }}" >> reports/build-report.txt
          echo "Image-tag: ${{ steps.tag.outputs.SHORT_SHA }}" >> reports/build-report.txt

      - name: subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/build-report.txt